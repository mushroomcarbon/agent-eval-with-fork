# State that exists only in a process's memory. Restarting the daemon loses the
# queue (and is detected), so the only way through is to work with the live process.
instruction = """
A job-queue daemon is running on localhost port 9090. Its queue lives only in the daemon's
memory, so do not restart or kill it. Read /srv/queue/README.txt for the protocol, then
complete every queued job. You are done when GET /status reports that no jobs are pending.
"""
max_steps = 30
setup = """
mkdir -p /srv/queue
cd /srv/queue
nohup python3 queued.py >/srv/queue/queued.log 2>&1 </dev/null &
for i in $(seq 1 50); do python3 -c 'import urllib.request as u; u.urlopen("http://127.0.0.1:9090/status", timeout=1)' 2>/dev/null && exit 0; sleep 0.1; done
echo "daemon did not start"; cat /srv/queue/queued.log; exit 1
"""
test = "python3 /tmp/forkeval_test.py"

[files]
"/srv/queue/README.txt" = '''
Queue daemon, port 9090. All responses are JSON.

  GET  /status               {"pending": N, "done": N, "rejected": N}
  GET  /next                 the next pending job: {"id": "...", "payload": "..."}; 404 when none are pending.
                             The same job is returned until it is completed.
  POST /done?id=ID&digest=D  completes job ID. D must be the SHA-256 hex digest of the job's
                             payload string (UTF-8). A wrong digest is rejected and counted.

More than 2 rejected submissions lock the queue for good.
'''
"/srv/queue/queued.py" = '''
import hashlib, json, os, secrets
from http.server import BaseHTTPRequestHandler, HTTPServer
from urllib.parse import parse_qs, urlparse

# Generated at start and never written anywhere: a restarted daemon has other jobs.
BOOT = secrets.token_hex(8)
JOBS = [{"id": f"job-{i}", "payload": secrets.token_urlsafe(24)} for i in range(5)]
DONE, REJECTED = [], 0
with open("/srv/queue/boot", "w") as f:
    f.write(BOOT)


class Handler(BaseHTTPRequestHandler):
    def _send(self, code, body):
        raw = json.dumps(body).encode()
        self.send_response(code)
        self.send_header("Content-Type", "application/json")
        self.send_header("Content-Length", str(len(raw)))
        self.end_headers()
        self.wfile.write(raw)

    def do_GET(self):
        path = urlparse(self.path).path
        if path == "/status":
            return self._send(200, {"pending": len(JOBS), "done": len(DONE), "rejected": REJECTED})
        if path == "/next":
            if REJECTED > 2:
                return self._send(423, {"error": "queue locked"})
            return self._send(200, JOBS[0]) if JOBS else self._send(404, {"error": "no pending jobs"})
        if path == "/boot":
            return self._send(200, {"boot": BOOT})
        self._send(404, {"error": "not found"})

    def do_POST(self):
        global REJECTED
        url = urlparse(self.path)
        if url.path != "/done":
            return self._send(404, {"error": "not found"})
        if REJECTED > 2:
            return self._send(423, {"error": "queue locked"})
        q = parse_qs(url.query)
        job = next((j for j in JOBS if j["id"] == q.get("id", [""])[0]), None)
        if job is None:
            return self._send(404, {"error": "no such pending job"})
        if q.get("digest", [""])[0] != hashlib.sha256(job["payload"].encode()).hexdigest():
            REJECTED += 1
            return self._send(400, {"error": "wrong digest", "rejected": REJECTED})
        JOBS.remove(job)
        DONE.append(job["id"])
        self._send(200, {"ok": True, "pending": len(JOBS)})

    def log_message(self, *args):
        pass


HTTPServer(("127.0.0.1", 9090), Handler).serve_forever()
'''

[test_files]
"/tmp/forkeval_test.py" = '''
import json, sys, urllib.request

def get(path):
    with urllib.request.urlopen("http://127.0.0.1:9090" + path, timeout=5) as r:
        return json.load(r)

try:
    status = get("/status")
    assert status["pending"] == 0 and status["done"] == 5, f"status {status}"
    assert status["rejected"] <= 2, f"queue locked: {status}"
    boot = open("/srv/queue/boot").read().strip()
    # The file is written once at daemon start. A different value in memory
    # would mean a second daemon is answering; equal values with all five of the
    # ORIGINAL jobs done means the original process was drained.
    assert get("/boot")["boot"] == boot, "the daemon was restarted"
except Exception as e:
    print("FAIL:", e)
    sys.exit(1)
print("PASS")
'''
