import json, sys, urllib.request

def get(path):
    with urllib.request.urlopen("http://127.0.0.1:8080" + path, timeout=5) as r:
        return json.load(r)

try:
    assert get("/health") == {"status": "ok"}, "health"
    for a, b in [(2, 3), (10, -4), (0, 0), (123, 877)]:
        got = get(f"/sum?a={a}&b={b}")
        assert got == {"result": a + b}, f"sum({a},{b}) = {got}"
except Exception as e:
    print("FAIL:", e)
    sys.exit(1)
print("PASS")
'''
